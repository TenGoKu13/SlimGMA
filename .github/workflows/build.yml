name: Tests & Build Windows EXE

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances de test
        run: python -m pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: python -m pip install pyinstaller pillow tkinterdnd2

      - name: Construire le .exe
        run: python -m PyInstaller --onefile --windowed --name "Compressez-PM-GMod" --collect-all tkinterdnd2 compressez_pm.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compressez-PM-GMod-EXE
          path: dist/Compressez-PM-GMod.exe
