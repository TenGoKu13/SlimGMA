name: Tests & Build Windows EXE

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances de test
        run: python -m pip install -r requirements-dev.txt

      - name: Installer xvfb (tests d'interface)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Vérifier l'absence de commentaires
        run: python tools/check_no_comments.py .

      - name: Lancer les tests
        run: xvfb-run -a python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: python -m pip install pyinstaller -r requirements.txt

      - name: Construire le .exe
        run: python -m PyInstaller --onefile --windowed --name "Compressez-PM-GMod" --collect-all tkinterdnd2 --collect-all srctools compressez_pm.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compressez-PM-GMod-EXE
          path: dist/Compressez-PM-GMod.exe
