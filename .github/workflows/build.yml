name: Tests & Build Windows EXE

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances de test
        run: python -m pip install -r requirements-dev.txt

      - name: Installer xvfb (tests d'interface)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Vérifier l'absence de commentaires
        run: python tools/check_no_comments.py .

      - name: Lancer les tests
        run: xvfb-run -a python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: python -m pip install pyinstaller -r requirements.txt

      - name: Construire le .exe portable
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name "Slimgma" --icon assets/slimgma.ico
          --add-data "assets/slimgma.ico;assets"
          --collect-all tkinterdnd2 --collect-all srctools slimgma.py

      - name: Mettre le portable de côté
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Move-Item dist/Slimgma.exe portable/Slimgma.exe

      - name: Construire le programme d'installation
        shell: pwsh
        run: ./.github/scripts/build-installer.ps1

      - name: Upload du .exe portable
        uses: actions/upload-artifact@v7
        with:
          name: Slimgma-portable
          path: portable/Slimgma.exe

      - name: Upload de l'installateur
        uses: actions/upload-artifact@v7
        with:
          name: Slimgma-installateur
          path: dist/Slimgma-Setup-*.exe
