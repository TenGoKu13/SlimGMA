name: Publier une version

on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v1.3.0 ou 1.3.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: python -m pip install pyinstaller -r requirements.txt

      - name: Vérifier que le tag correspond à la version de l'app
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $expected = (python -c "from cpm.constants import VERSION; print(VERSION)").Trim()
          if ($tag.TrimStart('v') -ne $expected) {
            throw "Tag $tag mais cpm/constants.py annonce $expected — mettez les deux d'accord avant de publier."
          }
          Write-Host "Tag $tag = version $expected"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$expected" >> $env:GITHUB_OUTPUT

      - name: Construire le .exe portable
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name "Slimgma" --icon assets/slimgma.ico
          --add-data "assets/slimgma.ico;assets"
          --collect-all tkinterdnd2 --collect-all srctools
          slimgma.py

      - name: Vérifier que le portable démarre (avant signature)
        run: dist\Slimgma.exe --help
        shell: cmd

      - name: Construire l'application pour l'installateur (sans compiler l'installateur)
        shell: pwsh
        run: ./.github/scripts/build-installer.ps1 -SkipCompile

      - name: Préparer le lot à signer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unsigned/app | Out-Null
          Copy-Item dist/Slimgma.exe unsigned/Slimgma.exe
          Copy-Item dist/Slimgma/Slimgma.exe unsigned/app/Slimgma.exe

      - name: Envoyer le lot non signé
        id: upload-unsigned-exes
        uses: actions/upload-artifact@v4
        with:
          name: slimgma-unsigned
          path: unsigned/**
          if-no-files-found: error

      - name: Signer le portable et l'application (SignPath)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ vars.SIGNPATH_ORGANIZATION_ID }}"
          project-slug: "Slimgma"
          signing-policy-slug: "release-signing"
          github-artifact-id: "${{ steps.upload-unsigned-exes.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Réinjecter les binaires signés
        shell: pwsh
        run: |
          Copy-Item signed/Slimgma.exe dist/Slimgma.exe -Force
          Copy-Item signed/app/Slimgma.exe dist/Slimgma/Slimgma.exe -Force

      - name: Vérifier que l'application signée démarre
        run: dist\Slimgma\Slimgma.exe --help
        shell: cmd

      - name: Mettre le portable signé de côté
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force livraison | Out-Null
          Move-Item dist/Slimgma.exe livraison/Slimgma.exe

      - name: Compiler l'installateur (avec l'application déjà signée)
        shell: pwsh
        run: ./.github/scripts/build-installer.ps1 -SkipBuild

      - name: Envoyer l'installateur non signé
        id: upload-unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: slimgma-installateur-non-signe
          path: dist/Slimgma-Setup-*.exe
          if-no-files-found: error

      - name: Signer l'installateur (SignPath)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ vars.SIGNPATH_ORGANIZATION_ID }}"
          project-slug: "Slimgma"
          signing-policy-slug: "release-signing"
          github-artifact-id: "${{ steps.upload-unsigned-setup.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Rassembler la livraison
        shell: pwsh
        run: |
          Copy-Item signed-installer/Slimgma-Setup-*.exe livraison/ -Force
          Get-ChildItem livraison | Format-Table Name, Length

      - name: Rédiger les notes de version
        shell: pwsh
        run: >
          python .github/scripts/release_notes.py
          "${{ steps.version.outputs.version }}" CHANGELOG.md notes.md

      - name: Créer la release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Slimgma ${{ steps.version.outputs.tag }}
          body_path: notes.md
          files: livraison/*
          draft: false
          prerelease: false
