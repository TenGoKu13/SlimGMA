name: Publier une version

on:
  push:
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v1.3.0 ou 1.3.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: python -m pip install pyinstaller -r requirements.txt

      - name: Vérifier que le tag correspond à la version de l'app
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $expected = (python -c "from cpm.constants import VERSION; print(VERSION)").Trim()
          if ($tag.TrimStart('v') -ne $expected) {
            throw "Tag $tag mais cpm/constants.py annonce $expected — mettez les deux d'accord avant de publier."
          }
          Write-Host "Tag $tag = version $expected"

      - name: Construire le .exe portable
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name "Slimgma" --icon assets/slimgma.ico
          --add-data "assets/slimgma.ico;assets"
          --collect-all tkinterdnd2 --collect-all srctools
          slimgma.py

      - name: Vérifier que le portable démarre
        run: dist\Slimgma.exe --help
        shell: cmd

      - name: Mettre le portable de côté
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force livraison | Out-Null
          Move-Item dist/Slimgma.exe livraison/Slimgma.exe

      - name: Construire le programme d'installation
        shell: pwsh
        run: ./.github/scripts/build-installer.ps1

      - name: Vérifier que l'application installée démarre
        run: dist\Slimgma\Slimgma.exe --help
        shell: cmd

      - name: Rassembler la livraison
        shell: pwsh
        run: Move-Item dist/Slimgma-Setup-*.exe livraison/

      - uses: actions/upload-artifact@v7
        with:
          name: livraison
          path: livraison/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: livraison
          path: livraison

      - name: Extraire les notes de version
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python - "$VERSION" <<'PY' > notes.md
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          pattern = rf"^## {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)"
          found = re.search(pattern, text, re.S | re.M)
          body = (found.group(1).strip() if found
                  else f"Voir CHANGELOG.md pour la version {version}.")
          print("## Télécharger\n")
          print(f"- **`Slimgma-Setup-{version}.exe`** — le programme "
                "d'installation. Raccourci dans le menu Démarrer, "
                "désinstallation depuis *Applications installées*. "
                "C'est celui qu'il vous faut.")
          print("- `Slimgma.exe` — la version portable, un seul fichier, "
                "rien d'installé. Pour une clé USB ou un PC où vous ne "
                "voulez rien laisser.\n")
          print("---\n")
          print(body)
          PY

      - name: Créer la release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Slimgma ${{ steps.notes.outputs.tag }}
          body_path: notes.md
          files: livraison/*
          draft: false
          prerelease: false
