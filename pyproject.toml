[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slimgma"
version = "1.3.0"
description = "Slimgma – compresseur d'addons Playermodel pour Garry's Mod (GUI + CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TenGoKu13" }]
keywords = ["garrysmod", "gmod", "playermodel", "gma", "vtf", "compression"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: French",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = []

[project.optional-dependencies]
gui = ["tkinterdnd2>=0.5.0"]
images = ["Pillow>=10.0.0"]
vtf = ["srctools>=2.7.0"]
dev = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/TenGoKu13/SlimGMA"
Issues = "https://github.com/TenGoKu13/SlimGMA/issues"
Changelog = "https://github.com/TenGoKu13/SlimGMA/blob/main/CHANGELOG.md"

[project.scripts]
slimgma = "cpm.cli:cli_main"

[tool.setuptools]
packages = ["cpm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
